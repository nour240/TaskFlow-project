<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="TaskFlow Dashboard — Your productivity overview">
  <title>TaskFlow — Dashboard</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-logo">
        <div class="logo-icon">T</div>
        <h1>TaskFlow</h1>
      </div>
      <nav class="sidebar-nav">
        <a href="/dashboard.html" class="active"><span class="nav-icon">📊</span> Dashboard</a>
        <a href="/projects.html"><span class="nav-icon">📁</span> Projects</a>
      </nav>
      <div class="sidebar-user">
        <div class="avatar" id="sidebar-user-avatar">U</div>
        <div class="user-info">
          <div class="user-name" id="sidebar-user-name">User</div>
          <div class="user-email" id="sidebar-user-email">user@email.com</div>
        </div>
        <button class="logout-btn" id="logout-btn" title="Logout">⏻</button>
      </div>
    </aside>

  
    <main class="main-content">
      <div class="page-header">
        <div>
          <h2>Dashboard</h2>
          <p class="subtitle">Welcome back! Here's your overview.</p>
        </div>
        <div class="notif-bell" id="notif-bell">
          🔔
          <span class="notif-badge" id="notif-badge" style="display:none">0</span>
          <div class="notif-dropdown" id="notif-dropdown">
            <div class="notif-header">Notifications</div>
            <div id="notif-list"></div>
          </div>
        </div>
      </div>

      <div id="dashboard-spinner" class="spinner"></div>

      
      <div class="stats-grid">
        <div class="stat-card accent">
          <div class="stat-icon">📁</div>
          <div class="stat-value" id="stat-projects">0</div>
          <div class="stat-label">Active Projects</div>
        </div>
        <div class="stat-card success">
          <div class="stat-icon">📋</div>
          <div class="stat-value" id="stat-assigned">0</div>
          <div class="stat-label">Assigned Tasks</div>
        </div>
        <div class="stat-card warning">
          <div class="stat-icon">✅</div>
          <div class="stat-value" id="stat-completed">0</div>
          <div class="stat-label">Completed</div>
        </div>
        <div class="stat-card danger">
          <div class="stat-icon">⚠️</div>
          <div class="stat-value" id="stat-overdue">0</div>
          <div class="stat-label">Overdue</div>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <div class="card-title">Ongoing Tasks</div>
        </div>
        <div class="task-list" id="ongoing-tasks"></div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/notifications.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
