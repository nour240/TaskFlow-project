<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="TaskFlow — All Projects">
  <title>TaskFlow — Projects</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-logo"><div class="logo-icon">T</div><h1>TaskFlow</h1></div>
      <nav class="sidebar-nav">
        <a href="/dashboard.html"><span class="nav-icon">📊</span> Dashboard</a>
        <a href="/projects.html"><span class="nav-icon">📁</span> Projects</a>
      </nav>
      <div class="sidebar-user">
        <div class="avatar" id="sidebar-user-avatar">U</div>
        <div class="user-info">
          <div class="user-name" id="sidebar-user-name">User</div>
          <div class="user-email" id="sidebar-user-email"></div>
        </div>
        <button class="logout-btn" id="logout-btn" title="Logout">⏻</button>
      </div>
    </aside>
    <main class="main-content">
      <div class="page-header">
        <div><h2>Projects</h2><p class="subtitle">Manage all your projects</p></div>
        <div style="display:flex;gap:12px;align-items:center">
          <div class="notif-bell" id="notif-bell">🔔<span class="notif-badge" id="notif-badge" style="display:none">0</span>
            <div class="notif-dropdown" id="notif-dropdown"><div class="notif-header">Notifications</div><div id="notif-list"></div></div>
          </div>
          <button class="btn btn-primary" id="create-project-btn">+ New Project</button>
        </div>
      </div>
      <div class="project-grid" id="projects-grid"><div class="spinner"></div></div>
      <div class="pagination" id="projects-pagination"></div>

      <div class="modal-overlay" id="project-modal-overlay">
        <div class="modal">
          <div class="modal-header"><h3>Create Project</h3><button class="modal-close" id="project-modal-close">✕</button></div>
          <form id="project-form">
            <div class="form-group"><label for="proj-title">Title</label><input type="text" id="proj-title" class="form-control" required></div>
            <div class="form-group"><label for="proj-desc">Description</label><textarea id="proj-desc" class="form-control"></textarea></div>
            <div class="form-group"><label for="proj-deadline">Deadline</label><input type="date" id="proj-deadline" class="form-control"></div>
            <div class="form-group"><label for="proj-status">Status</label>
              <select id="proj-status" class="form-control">
                <option value="actif">Actif</option><option value="en pause">En pause</option><option value="archivé">Archivé</option>
              </select>
            </div>
            <div class="modal-footer"><button type="button" class="btn btn-secondary" onclick="closeProjectModal()">Cancel</button><button type="submit" class="btn btn-primary">Create</button></div>
          </form>
        </div>
      </div>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/notifications.js"></script>
  <script src="/js/projects.js"></script>
</body>
</html>
