<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="TaskFlow — Project Details">
  <title>TaskFlow — Project</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-logo"><div class="logo-icon">T</div><h1>TaskFlow</h1></div>
      <nav class="sidebar-nav">
        <a href="/dashboard.html"><span class="nav-icon">📊</span> Dashboard</a>
        <a href="/projects.html"><span class="nav-icon">📁</span> Projects</a>
      </nav>
      <div class="sidebar-user">
        <div class="avatar" id="sidebar-user-avatar">U</div>
        <div class="user-info">
          <div class="user-name" id="sidebar-user-name">User</div>
          <div class="user-email" id="sidebar-user-email"></div>
        </div>
        <button class="logout-btn" id="logout-btn" title="Logout">⏻</button>
      </div>
    </aside>
    <main class="main-content">
      <!-- Project Header -->
      <div class="page-header">
        <div>
          <div style="display:flex;align-items:center;gap:12px;margin-bottom:4px">
            <a href="/projects.html" style="color:var(--text-muted);font-size:.85rem">← Projects</a>
            <span class="badge" id="project-status-badge"></span>
          </div>
          <h2 id="project-title">Loading...</h2>
          <p class="subtitle" id="project-desc"></p>
          <p class="subtitle" id="project-deadline" style="margin-top:2px"></p>
        </div>
        <div style="display:flex;gap:12px;align-items:center">
          <div class="notif-bell" id="notif-bell">🔔<span class="notif-badge" id="notif-badge" style="display:none">0</span>
            <div class="notif-dropdown" id="notif-dropdown"><div class="notif-header">Notifications</div><div id="notif-list"></div></div>
          </div>
          <div id="project-actions"></div>
        </div>
      </div>


      <div class="tabs">
        <button class="tab-btn active" data-tab="tab-tasks">Tasks</button>
        <button class="tab-btn" data-tab="tab-members">Members</button>
        <button class="tab-btn" data-tab="tab-activity">Activity</button>
      </div>
