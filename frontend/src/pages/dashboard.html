<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TaskFlow - Tableau de bord</title>
  <link rel="stylesheet" href="../style/style.css" />
</head>
<body>
  <header>
    <h1>TaskFlow</h1>
    <button onclick="logout()">Déconnexion</button>
  </header>

  <main class="container">
    <h2>Bienvenue, <span id="userName"></span> !</h2>
    <p>Vous êtes connecté.</p>
    <div id="dashboardContent">
      <p>Chargement des données...</p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    window.onload = function () {
      if (!isAuthenticated()) {
        window.location.href = '/login.html';
        return;
      }

      axios.get('/api/auth/me')
        .then(res => {
          document.getElementById('userName').textContent = res.data.user.fullName;
          document.getElementById('dashboardContent').innerHTML = `
            <p>Nombre de projets actifs : <strong>0</strong></p>
            <p>Tâches assignées : <strong>0</strong></p>
            <p>Tâches terminées : <strong>0</strong></p>
            <p>Tâches en retard : <strong>0</strong></p>
          `;
        })
        .catch(err => {
          console.error(err);
          alert('Erreur de chargement du tableau de bord');
          removeToken();
          window.location.href = '/login.html';
        });
    };
  </script>
</body>
</html>
